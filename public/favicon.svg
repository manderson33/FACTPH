<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#27384E" opacity="0.9"/>
    </pattern>
    <clipPath id="circleClip">
      <circle cx="250" cy="250" r="217"/>
    </clipPath>
    <radialGradient id="textScrim" cx="50%" cy="56%" r="55%">
      <stop offset="0%" stop-color="#0E1B2C" stop-opacity="0.78"/>
      <stop offset="70%" stop-color="#0E1B2C" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0E1B2C" stop-opacity="0.15"/>
    </radialGradient>
  </defs>

  <!-- radial data ticks (outside main ring) -->
  <g>
    <line x1="250.0" y1="24.0" x2="250.0" y2="12.0" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="294.1" y1="28.3" x2="296.4" y2="16.6" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="336.5" y1="41.2" x2="341.1" y2="30.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="375.6" y1="62.1" x2="382.2" y2="52.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="409.8" y1="90.2" x2="418.3" y2="81.7" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="437.9" y1="124.4" x2="447.9" y2="117.8" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="458.8" y1="163.5" x2="469.9" y2="158.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="471.7" y1="205.9" x2="483.4" y2="203.6" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="476.0" y1="250.0" x2="488.0" y2="250.0" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="471.7" y1="294.1" x2="483.4" y2="296.4" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="458.8" y1="336.5" x2="469.9" y2="341.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="437.9" y1="375.6" x2="447.9" y2="382.2" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="409.8" y1="409.8" x2="418.3" y2="418.3" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="375.6" y1="437.9" x2="382.2" y2="447.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="336.5" y1="458.8" x2="341.1" y2="469.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="294.1" y1="471.7" x2="296.4" y2="483.4" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="250.0" y1="476.0" x2="250.0" y2="488.0" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="205.9" y1="471.7" x2="203.6" y2="483.4" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="163.5" y1="458.8" x2="158.9" y2="469.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="124.4" y1="437.9" x2="117.8" y2="447.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="90.2" y1="409.8" x2="81.7" y2="418.3" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="62.1" y1="375.6" x2="52.1" y2="382.2" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="41.2" y1="336.5" x2="30.1" y2="341.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="28.3" y1="294.1" x2="16.6" y2="296.4" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="24.0" y1="250.0" x2="12.0" y2="250.0" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="28.3" y1="205.9" x2="16.6" y2="203.6" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="41.2" y1="163.5" x2="30.1" y2="158.9" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="62.1" y1="124.4" x2="52.1" y2="117.8" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="90.2" y1="90.2" x2="81.7" y2="81.7" stroke="#2DD4BF" stroke-width="3" opacity="0.85"/>
    <line x1="124.4" y1="62.1" x2="117.8" y2="52.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="163.5" y1="41.2" x2="158.9" y2="30.1" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
    <line x1="205.9" y1="28.3" x2="203.6" y2="16.6" stroke="#2DD4BF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- main navy disc -->
  <circle cx="250" cy="250" r="220" fill="#0E1B2C"/>

  <g clip-path="url(#circleClip)">

    <!-- ===== PH flag, filling the disc, blue/red clearly visible ===== -->
    <g transform="translate(250,250) rotate(-4)">
      <!-- flag proportions: height 460, width 920 (ratio 1:2), centered -->
      <g transform="translate(-460,-230)">
        <rect x="230" y="0" width="690" height="230" fill="#0038A8" opacity="0.62"/>
        <rect x="230" y="230" width="690" height="230" fill="#CE1126" opacity="0.62"/>
        <polygon points="0,0 0,460 398,230" fill="#FFFFFF" opacity="0.5"/>
        <g transform="translate(133,230)" opacity="0.6">
          <g fill="#FCD116">
            <circle r="38"/>
            <rect x="-5" y="-88" width="10" height="44"/>
            <rect x="-5" y="44" width="10" height="44"/>
            <rect x="-88" y="-5" width="44" height="10"/>
            <rect x="44" y="-5" width="44" height="10"/>
            <g transform="rotate(45)">
              <rect x="-5" y="-88" width="10" height="44"/>
              <rect x="-5" y="44" width="10" height="44"/>
              <rect x="-88" y="-5" width="44" height="10"/>
              <rect x="44" y="-5" width="44" height="10"/>
            </g>
          </g>
        </g>
        <g fill="#FCD116" opacity="0.6">
          <circle cx="27" cy="27" r="13"/>
          <circle cx="27" cy="433" r="13"/>
          <circle cx="375" cy="230" r="13"/>
        </g>
      </g>
    </g>

    <!-- dotted data grid over the flag, lets stripes read through -->
    <rect x="20" y="20" width="460" height="460" fill="url(#dotgrid)" opacity="0.85"/>

    <!-- faint rising data line across the lower disc -->
    <polyline points="90,368 150,348 200,358 255,308 310,328 370,278"
              fill="none" stroke="#2DD4BF" stroke-width="4" opacity="0.3"/>
    <g fill="#2DD4BF" opacity="0.35">
      <circle cx="90" cy="368" r="5"/>
      <circle cx="150" cy="348" r="5"/>
      <circle cx="200" cy="358" r="5"/>
      <circle cx="255" cy="308" r="5"/>
      <circle cx="310" cy="328" r="5"/>
      <circle cx="370" cy="278" r="5"/>
    </g>

    <!-- scrim so the wordmark stays crisp over the flag -->
    <rect x="20" y="20" width="460" height="460" fill="url(#textScrim)"/>
  </g>

  <!-- inner thin ring for depth -->
  <circle cx="250" cy="250" r="206" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.35"/>

  <!-- outer ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#2DD4BF" stroke-width="7"/>

  <!-- three small stars, nod to the PH flag -->
  <g fill="#FCD116" opacity="0.9">
    <circle cx="250" cy="128" r="4.5"/>
    <circle cx="197" cy="158" r="4.5"/>
    <circle cx="303" cy="158" r="4.5"/>
  </g>

  <!-- wordmark -->
  <text x="250" y="255" text-anchor="middle" font-family="Arial Black, Arial, sans-serif"
        font-size="70" font-weight="900" fill="#FFFFFF" letter-spacing="-1">FACTPH</text>

  <!-- divider -->
  <line x1="175" y1="278" x2="325" y2="278" stroke="#2DD4BF" stroke-width="2" opacity="0.7"/>

  <text x="250" y="308" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="21" font-weight="700" fill="#2DD4BF" letter-spacing="4">IN 2 MINUTES</text>
</svg>